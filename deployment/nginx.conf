# =====================================================================
# 希卡莉 (Hikari) - Nginx 反向代理配置
# 基于：重构参考文档 MASTER v3.0 第六节（URL 路由范式）
#
# 三层解耦原则：
#   第一层 URL（路由契约）：对用户和前端的承诺，发布后不改
#   第二层 Nginx（部署契约）：请求去哪个容器，此文件管理
#   第三层 代码（逻辑契约）：功能实现，移到新容器时只改此文件
#
# 新增工具规则：
#   在 [新工具插入点] 上方插入：
#   location /api/u/{新资源}/ { proxy_pass http://hikari-{工具名}:{端口}; }
#
# 删除功能规则：注释掉对应 location，不要删除（保留恢复能力）
# =====================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  20480;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Docker 内网 DNS（容器名解析）
    # valid=5s：容器重启后最多 5 秒内自动刷新，无需手动 reload nginx
    resolver 127.0.0.11 valid=5s ipv6=off;

    # --- 日志脱敏（token 参数打码）---
    map $request_uri $masked_uri {
        "~^(?P<prefix>.*)token=[^&]*(?P<suffix>.*)$"  "${prefix}token=********${suffix}";
        default $request_uri;
    }

    log_format masked_combined '$remote_addr - $remote_user [$time_local] '
                               '"$masked_uri" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent"';

    # --- 缓冲区 ---
    client_header_buffer_size    128k;
    large_client_header_buffers  16 512k;

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log masked_combined buffer=32k flush=1s;
    error_log  /var/log/nginx/error.log warn;

    # 限速区定义
    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ws_limit:10m;

    # =====================================================================
    # API 主服务 Upstream（支持 ip_hash 粘性会话 + 水平扩容）
    # hikari_api_pool  : 用户端，ip_hash 粘性（WebSocket 长连接）
    # hikari_api_store : 门店端，round-robin（并发低，屏幕重连靠 pending 补发）
    # 单实例：两个 upstream 指向同一容器，等价
    # 扩容时：各自独立调度，互不干扰
    # =====================================================================
    upstream hikari_api_pool {
        ip_hash;
        server hikari-api:8000;
        # 扩容时追加：server hikari-api-2:8000;
    }

    upstream hikari_api_store {
        server hikari-api:8000;
        # 扩容时追加：server hikari-api-2:8000;
    }

    # =====================================================================
    # 主服务（HTTP 80）
    # =====================================================================
    server {
        listen      80;
        server_name localhost;

        add_header X-Frame-Options      "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"   always;
        add_header X-XSS-Protection     "1; mode=block" always;
        server_tokens off;

        # ==================================================================
        # 区域 1：WebSocket（最高优先级，必须在所有 HTTP location 之前）
        # ==================================================================

        # 用户主 WebSocket（chat 页）
        location /api/u/ws/ {
            limit_conn ws_limit 20;

            proxy_pass             http://hikari_api_pool;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection $connection_upgrade;
            proxy_set_header       Host       $http_host;
            proxy_set_header       Origin     "$scheme://$http_host";
            proxy_set_header       X-Real-IP  $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
            proxy_buffering        off;
        }

        # 屏幕端 WebSocket（到店场景）
        location /api/s/ws/ {
            limit_conn ws_limit 10;

            proxy_pass             http://hikari_api_store;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection $connection_upgrade;
            proxy_set_header       Host       $http_host;
            proxy_set_header       Origin     "$scheme://$http_host";
            proxy_set_header       X-Real-IP  $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
            proxy_buffering        off;
        }

        # ==================================================================
        # 区域 2：工具容器分流（细路径，优先于 /api/u/ 兜底）
        # 规则：从细到粗，新增工具永远插在 [新工具插入点] 上方
        # ==================================================================

        # [新工具插入点] — 新增工具 location 插在此行上方

        location /api/u/copywriting/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $backend_copywriting http://hikari-copywriting:8004;
            proxy_pass             $backend_copywriting;
            proxy_http_version     1.1;
            proxy_set_header       Host              $http_host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     120s;
        }

        location /api/u/makeup/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $backend_makeup http://hikari-makeup:8003;
            proxy_pass             $backend_makeup;
            proxy_http_version     1.1;
            proxy_set_header       Host              $http_host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     120s;
        }

        # 精确匹配上传入口（无尾斜杠，wx.uploadFile 不跟随 301）
        location = /api/u/images {
            limit_req zone=api_limit burst=30 nodelay;
            set $backend_imagegen http://hikari-imagegen:8002;
            proxy_pass             $backend_imagegen;
            proxy_http_version     1.1;
            proxy_set_header       Host              $http_host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     180s;
            client_max_body_size   20M;
        }

        location /api/u/images/ {
            limit_req zone=api_limit burst=30 nodelay;
            set $backend_imagegen http://hikari-imagegen:8002;
            proxy_pass             $backend_imagegen;
            proxy_http_version     1.1;
            proxy_set_header       Host              $http_host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     180s;
            client_max_body_size   20M;
        }

        # ==================================================================
        # 区域 3：公开商城（独立容器，无鉴权）
        # ==================================================================

        location /api/p/ {
            set $backend_shop http://hikari-shop:8001;
            proxy_pass             $backend_shop;
            proxy_http_version     1.1;
            proxy_set_header       Host              $http_host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     30s;
            # 公开接口无需限速
        }

        # ==================================================================
        # 区域 3.5：语音文件（静态直出，跳过后端鉴权，wx.createInnerAudioContext 无法带 header）
        # URL 结构中含 user_id + session_id，猜测难度足够
        # ==================================================================

        location /api/u/voices/ {
            alias         /app/assets/voices/;
            autoindex     off;
            expires       1h;
            add_header    Cache-Control "private";
            add_header    Access-Control-Allow-Origin "*";
            try_files     $uri =404;
        }

        # ==================================================================
        # 区域 4：主服务兜底（粗路径，必须在所有工具容器 location 之后）
        # ==================================================================

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass             http://hikari_api_pool;
            proxy_http_version     1.1;
            proxy_set_header       Host              $http_host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     600s;
        }

        # ==================================================================
        # 区域 5：宿主机服务
        # ==================================================================

        # GPT-SoVITS TTS 引擎（宿主机，frp 内网穿透接入）
        location /tts_api/ {
            proxy_pass         http://host.docker.internal:9880/;
            proxy_set_header   Host $host;
            proxy_read_timeout 300s;
        }

        # ==================================================================
        # 区域 6：静态资源
        # ==================================================================

        # 套餐图片（公开访问，hikari-shop 的静态资源，CDN 友好）
        location /api/p/images/ {
            alias         /app/assets/packages/;
            autoindex     off;
            expires       7d;
            add_header    Cache-Control "public";
            add_header    Access-Control-Allow-Origin "*";
            try_files     $uri =404;
        }

        # 屏幕端页面（所有分店共用，通过 ?s= 短码区分）
        location /store_screen.html {
            root /usr/share/nginx/html;
        }

        # H5 中转页（签到二维码扫码后跳转小程序，配合微信 JS-SDK）
        # 上线前配置：STORE_QR_BASE_URL=https://你的域名/checkin
        location /checkin {
            root      /usr/share/nginx/html;
            try_files /checkin.html =404;
        }

        # 本地化 JS 库（three.js / three-vrm 等，离线可用）
        location /static/ {
            alias      /usr/share/nginx/html/static/;
            expires    30d;
            add_header Cache-Control "public, immutable";
        }

        # Live2D VRM 模型（各分店独立子目录）
        location /live2d/ {
            alias      /app/assets/live2d/;
            expires    7d;
            add_header Cache-Control "public, immutable";
        }

        # 背景视频（H.264 1080p，支持 Range 请求）
        location /live2d_background/ {
            alias      /app/assets/live2d_background/;
            expires    7d;
            add_header Cache-Control "public";
            add_header Accept-Ranges bytes;
        }

        # ==================================================================
        # 区域 7：系统健康检查（无鉴权，Nginx upstream 探活用）
        # ==================================================================

        location = /api/sys/health {
            set $backend_api http://hikari-api:8000;
            proxy_pass         $backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $http_host;
            access_log         off;
        }

        error_page 500 502 503 504 /50x.html;
    }
}
